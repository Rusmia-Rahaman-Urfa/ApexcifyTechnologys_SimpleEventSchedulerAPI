<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Event Scheduler</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-10">
    <div class="max-w-2xl mx-auto bg-white p-8 rounded-lg shadow">
        <h1 class="text-2xl font-bold mb-6 text-blue-600">Schedule New Event</h1>
        
        <div class="space-y-4 mb-10">
            <input id="title" type="text" placeholder="Event Title" class="w-full p-2 border rounded">
            <input id="date" type="date" class="w-full p-2 border rounded">
            <textarea id="desc" placeholder="Description" class="w-full p-2 border rounded"></textarea>
            <button onclick="addEvent()" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Add Event</button>
        </div>

        <h2 class="text-xl font-semibold mb-4">Upcoming Events</h2>
        <div id="eventList" class="space-y-3">
            </div>
    </div>

    <script>
        const API_URL = "http://localhost:5000/events";

        // Load Events
        async function fetchEvents() {
            const res = await fetch(API_URL);
            const data = await res.json();
            const list = document.getElementById('eventList');
            list.innerHTML = '';
            data.forEach(ev => {
                list.innerHTML += `
                    <div class="p-4 border-l-4 border-blue-500 bg-gray-50">
                        <p class="font-bold">${ev.title} <span class="text-sm font-normal text-gray-500">(${ev.date})</span></p>
                        <p class="text-gray-600 text-sm">${ev.description}</p>
                    </div>`;
            });
        }

        // Add Event
        async function addEvent() {
            const title = document.getElementById('title').value;
            const date = document.getElementById('date').value;
            const description = document.getElementById('desc').value;

            const res = await fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ title, date, description })
            });

            const result = await res.json();
            if (res.status === 400) alert(result.message);
            else {
                alert(result.message);
                fetchEvents(); // Refresh list
            }
        }

        fetchEvents();
    </script>
</body>
</html>
