<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Scheduler</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #0f172a; 
            color: #f1f5f9;
            min-height: 100vh;
        }
        .dark-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .accent-gradient {
            background: linear-gradient(135deg, #8b5cf6 0%, #06b6d4 100%);
        }
        .input-dark {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(71, 85, 105, 0.5);
            color: #f8fafc;
        }
        .input-dark:focus {
            border-color: #8b5cf6;
            box-shadow: 0 0 0 2px rgba(139, 92, 246, 0.2);
        }
        /* Custom Scrollbar for dark theme */
        #eventList::-webkit-scrollbar { width: 6px; }
        #eventList::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        
        /* SweetAlert Dark Overrides */
        .swal2-popup {
            background: #1e293b !important;
            color: #f1f5f9 !important;
        }
    </style>
</head>
<body class="p-6 md:p-12">
    <div class="max-w-6xl mx-auto">
        <header class="flex items-center justify-between mb-12">
            <div>
                <h1 class="text-4xl font-extrabold tracking-tight text-white">Event<span class="text-indigo-400">Sync</span></h1>
                <p class="text-slate-400 mt-1">Cloud-connected event management</p>
            </div>
            <div class="hidden md:block">
                <div class="accent-gradient h-1 w-32 rounded-full opacity-50"></div>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-10">
            <div class="lg:col-span-5">
                <div class="dark-card p-8 rounded-3xl shadow-2xl">
                    <h2 class="text-xl font-bold mb-6 flex items-center">
                        <span class="accent-gradient p-1 rounded-md mr-2"></span> 
                        Schedule New
                    </h2>
                    
                    <div class="space-y-5">
                        <div>
                            <label class="text-xs font-bold text-slate-500 uppercase tracking-widest ml-1">Title</label>
                            <input id="title" type="text" placeholder="Enter Event Title..." 
                                class="input-dark w-full mt-2 p-4 rounded-xl outline-none transition-all">
                        </div>
                        
                        <div>
                            <label class="text-xs font-bold text-slate-500 uppercase tracking-widest ml-1">Event Date</label>
                            <input id="date" type="date" 
                                class="input-dark w-full mt-2 p-4 rounded-xl outline-none">
                        </div>
                        
                        <div>
                            <label class="text-xs font-bold text-slate-500 uppercase tracking-widest ml-1">Details</label>
                            <textarea id="description" placeholder="Optional notes..." rows="3"
                                class="input-dark w-full mt-2 p-4 rounded-xl outline-none"></textarea>
                        </div>
                        
                        <button id="addBtn" onclick="addEvent()" 
                            class="accent-gradient w-full text-white font-bold py-4 rounded-xl shadow-lg shadow-indigo-900/20 hover:scale-[1.02] transition-transform active:scale-95 mt-4">
                            Save Event
                        </button>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-7">
                <div class="flex items-center justify-between mb-8 px-2">
                    <h2 class="text-2xl font-bold">Timeline</h2>
                    <span id="eventCount" class="text-xs font-bold bg-slate-800 text-indigo-300 border border-slate-700 px-4 py-2 rounded-full">
                        0 Active Events
                    </span>
                </div>
                
                <div id="eventList" class="space-y-4 max-h-[600px] overflow-y-auto pr-4">
                    </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "http://localhost:5000/events";

        async function fetchEvents() {
            try {
                const res = await fetch(API_URL);
                const data = await res.json();
                const list = document.getElementById('eventList');
                const countBadge = document.getElementById('eventCount');
                
                list.innerHTML = '';
                countBadge.innerText = `${data.length} Active Events`;
                
                if (data.length === 0) {
                    list.innerHTML = `
                        <div class="text-center py-20 bg-slate-800/30 rounded-3xl border border-dashed border-slate-700">
                            <p class="text-slate-500">Your cloud database is empty.</p>
                        </div>`;
                    return;
                }

                data.forEach(ev => {
                    list.innerHTML += `
                        <div class="dark-card p-6 rounded-2xl hover:bg-slate-800/80 transition-all border-l-4 border-indigo-500">
                            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
                                <div class="flex-1">
                                    <h3 class="text-xl font-bold text-slate-100">${ev.title}</h3>
                                    <p class="text-slate-400 text-sm mt-1 leading-relaxed">${ev.description || 'No description available.'}</p>
                                </div>
                                <div class="flex items-center space-x-2">
                                    <div class="text-right">
                                        <p class="text-[10px] font-black text-slate-500 uppercase tracking-tighter">Scheduled For</p>
                                        <p class="text-sm font-bold text-cyan-400">${ev.date}</p>
                                    </div>
                                </div>
                            </div>
                        </div>`;
                });
            } catch (error) {
                console.error("Error:", error);
            }
        }

        async function addEvent() {
            const btn = document.getElementById('addBtn');
            const titleInput = document.getElementById('title');
            const dateInput = document.getElementById('date');
            const descInput = document.getElementById('description');

            btn.disabled = true;
            btn.innerHTML = `<span class="animate-pulse">Connecting...</span>`;

            const payload = {
                title: titleInput.value.trim(),
                date: dateInput.value,
                description: descInput.value.trim()
            };

            if (!payload.title || !payload.date) {
                Swal.fire({ icon: 'info', title: 'Action Required', text: 'Enter title and date.', confirmButtonColor: '#8b5cf6' });
                resetBtn(btn);
                return;
            }

            try {
                const res = await fetch(API_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                const result = await res.json();

                if (res.ok) {
                    Swal.fire({ icon: 'success', title: 'Saved', text: result.message, confirmButtonColor: '#8b5cf6', timer: 1500 });
                    titleInput.value = ''; dateInput.value = ''; descInput.value = '';
                    fetchEvents(); 
                } else {
                    Swal.fire({ icon: 'error', title: 'Denied', text: result.message, confirmButtonColor: '#ef4444' });
                }
            } catch (error) {
                Swal.fire({ icon: 'error', title: 'Network Error', text: 'Backend unreachable.', confirmButtonColor: '#ef4444' });
            } finally {
                resetBtn(btn);
            }
        }

        function resetBtn(btn) {
            btn.disabled = false;
            btn.innerHTML = "Save Event";
        }

        fetchEvents();
    </script>
</body>
</html>
